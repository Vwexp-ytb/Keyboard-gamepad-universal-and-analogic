name: Build and publish Windows releases

on:
  push:
    tags: ["v*", "V*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare vgamepad without installing its system driver
        run: python scripts/vendor_vgamepad.py
      - name: Run automated checks
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: |
          python -m PyInstaller --clean ace60_gamepad.spec
          python -m PyInstaller --clean ace60_gamepad_gui.spec
      - name: Publish release with both editions
        uses: softprops/action-gh-release@v2
        with:
          name: ACE60 Gamepad ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ACE60-Gamepad-CLI.exe
            dist/ACE60-Gamepad-GUI.exe
