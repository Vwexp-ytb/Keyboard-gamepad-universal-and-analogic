name: Windows CI and releases

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*", "V*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set release version
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $version = $env:REF_NAME -replace '^[vV]', ''
          if ($env:EVENT_NAME -eq 'pull_request') { $version = '0.0.0-pr' }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Prepare vgamepad without installing its system driver
        run: python scripts/vendor_vgamepad.py
      - name: Run automated checks
        run: python -m unittest discover -s tests -v
      - name: Build CLI and GUI executables
        run: |
          python -m PyInstaller --clean ace60_gamepad.spec
          python -m PyInstaller --clean ace60_gamepad_gui.spec
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/installers | Out-Null
          iscc "/DAppVersion=$env:APP_VERSION" installer/ACE60-Gamepad.iss
      - name: Upload build artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ACE60-Gamepad-pr-build
          path: |
            dist/ACE60-Gamepad-CLI.exe
            dist/ACE60-Gamepad-GUI.exe
            dist/installers/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ACE60 Gamepad ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/ACE60-Gamepad-CLI.exe
            dist/ACE60-Gamepad-GUI.exe
            dist/installers/*.exe
